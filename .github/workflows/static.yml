# Deploys the version page to GitHub Pages: only the files the app reads online
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Sub-repo releases land without a push here, so rebuild the catalog daily too
  schedule:
    - cron: "17 3 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build site content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['finshin-impact']['sdk-version'])")
          python3 -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install --quiet "https://github.com/FinshinLabs/FinshinSDK/releases/download/v${version}/finshin_sdk-${version}-py3-none-any.whl"
          mkdir site
          cp pyproject.toml site/pyproject.toml
          "$RUNNER_TEMP/sdk/bin/python" packaging/gen_catalog.py site/adapters.toml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Copy at deploy time keeps pyproject.toml the single source of the version
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
